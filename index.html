<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pickleball RR">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Pickleball Round Robin — Court Day</title>
<style>
  :root {
    --primary: #2563EB;
    --primary-dark: #1D4ED8;
    --accent: #059669;
    --accent-dark: #047857;
    --bg: #F8FAFC;
    --fg: #0F172A;
    --muted: #F1F5FD;
    --muted-fg: #64748B;
    --border: #E4ECFC;
    --destructive: #DC2626;
    --amber: #D97706;
    --amber-dark: #B45309;
    --amber-soft: #FEF3C7;
    --green-soft: #ECFDF5;
    --card: #FFFFFF;
    --sk-green: #22C55E;
    --sk-blue: #3B82F6;
    --sk-orange: #F97316;
    --sk-red: #EF4444;
    --radius: 14px;
    --font-body: 'Barlow', system-ui, -apple-system, sans-serif;
    --font-display: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
    --tabbar-h: 64px;
  }

  @page { size: letter; margin: 0.5in; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    font-family: var(--font-body);
    color: var(--fg);
    background: var(--bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  button {
    font-family: inherit;
    touch-action: manipulation;
    cursor: pointer;
    transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  button:active { transform: scale(0.97); }

  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--primary);
    outline-offset: 2px;
  }

  input, select { font-family: inherit; color: var(--fg); }

  h1, h2, h3, .display { font-family: var(--font-display); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.001ms !important;
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }

  /* ============ Buttons ============ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px;
    padding: 10px clamp(12px, 4vw, 20px);
    font-size: clamp(0.9rem, 2.6vw, 1rem);
    font-weight: 600;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--fg);
  }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn-amber { background: var(--amber); border-color: var(--amber); color: #fff; }
  .btn-amber:hover { background: var(--amber-dark); border-color: var(--amber-dark); }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--muted-fg); }
  .btn-ghost:hover { color: var(--fg); background: var(--muted); }
  .btn-danger { background: transparent; border-color: var(--destructive); color: var(--destructive); }
  .btn-danger:hover { background: var(--destructive); color: #fff; }
  .btn-block { width: 100%; }

  /* ============ Setup view ============ */
  #viewSetup { display: none; }
  #viewSetup.active { display: block; }

  .setup-inner {
    max-width: 520px; margin: 0 auto;
    padding: clamp(16px, 5vw, 28px) clamp(14px, 4.5vw, 24px) 120px;
  }

  .setup-brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: clamp(18px, 5vw, 28px);
  }
  .setup-brand svg { flex-shrink: 0; }
  .setup-brand h1 {
    font-size: clamp(1.7rem, 7vw, 2.2rem);
    font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
    line-height: 1; color: var(--fg);
  }
  .setup-brand .tagline {
    font-size: 0.82rem; color: var(--muted-fg); font-weight: 500;
  }

  .field-label {
    display: block; font-weight: 700; font-size: 0.78rem;
    text-transform: uppercase; letter-spacing: 1px;
    margin: 22px 0 8px; color: var(--muted-fg);
  }

  .seg {
    display: flex; background: var(--muted); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 4px; gap: 4px;
  }
  .seg button {
    flex: 1; min-height: 44px; border: none; border-radius: 9px;
    background: transparent; font-size: clamp(0.88rem, 2.6vw, 0.95rem); font-weight: 600;
    color: var(--muted-fg);
  }
  .seg button.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,0.3); }

  .mode-hint { font-size: 0.82rem; color: var(--muted-fg); margin-top: 8px; line-height: 1.4; }

  .player-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .player-row .player-num {
    width: 24px; text-align: center; flex-shrink: 0;
    font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: var(--muted-fg);
  }
  .player-row input {
    flex: 1; min-width: 0; min-height: 48px; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 1rem; background: var(--card);
  }
  .player-row input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }

  .skill-btn {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    border: 3px solid var(--border); background: var(--muted);
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .skill-btn::after {
    content: ''; width: 22px; height: 22px; border-radius: 50%;
    background: var(--border); transition: background-color 0.2s ease;
  }
  .skill-btn.hidden { visibility: hidden; }
  .skill-btn[data-skill="green"] { border-color: var(--sk-green); }
  .skill-btn[data-skill="green"]::after { background: var(--sk-green); }
  .skill-btn[data-skill="blue"] { border-color: var(--sk-blue); }
  .skill-btn[data-skill="blue"]::after { background: var(--sk-blue); }
  .skill-btn[data-skill="orange"] { border-color: var(--sk-orange); }
  .skill-btn[data-skill="orange"]::after { background: var(--sk-orange); }
  .skill-btn[data-skill="red"] { border-color: var(--sk-red); }
  .skill-btn[data-skill="red"]::after { background: var(--sk-red); }

  .skill-legend {
    display: none; flex-wrap: wrap; gap: 8px 16px; font-size: 0.78rem;
    color: var(--muted-fg); margin-top: 10px; align-items: center;
  }
  .skill-legend.show { display: flex; }
  .skill-legend span { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .legend-dot.green { background: var(--sk-green); }
  .legend-dot.blue { background: var(--sk-blue); }
  .legend-dot.orange { background: var(--sk-orange); }
  .legend-dot.red { background: var(--sk-red); }

  .setup-cta {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 12px clamp(14px, 4.5vw, 24px) calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 65%, rgba(248,250,252,0));
    display: none;
  }
  #viewSetup.active ~ .setup-cta, .setup-cta.show { display: block; }
  .setup-cta .btn { max-width: 520px; margin: 0 auto; display: flex; min-height: 56px; font-size: 1.1rem;
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    box-shadow: 0 6px 18px rgba(5,150,105,0.35); }

  /* ============ App shell ============ */
  #appShell { display: none; }
  #appShell.active { display: block; }

  .tab-view { display: none; }
  .tab-view.active { display: block; }

  .view-pad {
    max-width: 560px; margin: 0 auto;
    padding: clamp(12px, 3.5vw, 20px) clamp(12px, 3.5vw, 20px)
      calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom));
  }

  .view-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .view-header h2 {
    font-size: clamp(1.4rem, 6vw, 1.8rem); font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .icon-btn {
    min-height: 44px; min-width: 44px; padding: 8px 12px;
    border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--card); color: var(--muted-fg);
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.82rem; font-weight: 600;
  }
  .icon-btn:hover { color: var(--primary); border-color: var(--primary); }
  .icon-btn svg { flex-shrink: 0; }

  /* ============ Schedule cards ============ */
  .round-card {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }
  .round-card .rc-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .round-card .rc-label {
    font-family: var(--font-display); font-weight: 700; font-size: 1.05rem;
    text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted-fg);
  }
  .round-card .rc-status {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
    padding: 3px 9px; border-radius: 999px;
  }

  .rc-court {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
  }
  .rc-court + .rc-court { border-top: 1px dashed var(--border); }
  .court-chip {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
    background: var(--muted); color: var(--primary); border: 1.5px solid var(--border);
  }
  .rc-match { flex: 1; min-width: 0; font-size: clamp(0.85rem, 2.7vw, 0.95rem); line-height: 1.45; }
  .rc-match b { font-weight: 700; }
  .rc-vs { font-size: 0.68rem; font-weight: 700; letter-spacing: 1.5px; color: var(--muted-fg); }
  .score-badge {
    flex-shrink: 0; font-variant-numeric: tabular-nums;
    font-family: var(--font-display); font-weight: 700; font-size: 1rem;
    padding: 4px 10px; border-radius: 9px;
    background: var(--green-soft); color: var(--accent-dark);
    border: 1.5px solid #A7F3D0;
  }
  .score-badge.pending { background: var(--muted); color: var(--muted-fg); border-color: var(--border); }

  .round-card.r-active {
    border: 2px solid var(--primary);
    box-shadow: 0 6px 20px rgba(37,99,235,0.18);
  }
  .round-card.r-active .rc-label { color: var(--primary); }
  .round-card.r-active .rc-status { background: var(--primary); color: #fff; }
  .round-card.r-active .court-chip { background: var(--primary); color: #fff; border-color: var(--primary); }

  .round-card.r-done { opacity: 0.78; }
  .round-card.r-done .rc-status { background: var(--green-soft); color: var(--accent-dark); }
  .round-card.r-done .rc-court { padding: 6px 0; }
  .round-card.r-done .rc-match { font-size: 0.85rem; }

  .round-card.r-upcoming { opacity: 0.6; }
  .round-card.r-upcoming .rc-status { background: var(--muted); color: var(--muted-fg); }

  /* ============ Timer tab ============ */
  .timer-hero { text-align: center; padding-top: 4px; }

  .round-indicator {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.3rem, 5.5vw, 1.7rem);
    text-transform: uppercase; letter-spacing: 1px; color: var(--fg);
  }
  .round-progress { font-size: 0.82rem; color: var(--muted-fg); margin-top: 2px; margin-bottom: 12px; }

  .now-playing { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .np-court {
    background: var(--card); border: 1.5px solid var(--border);
    border-left: 5px solid var(--primary);
    border-radius: 12px; padding: 10px 12px; text-align: left;
    display: flex; align-items: center; gap: 10px;
  }
  .np-court .court-chip { background: var(--primary); color: #fff; border-color: var(--primary); }
  .np-match { font-size: clamp(0.88rem, 2.8vw, 0.98rem); line-height: 1.45; }
  .np-match b { font-weight: 700; }

  .complete-banner {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff; border-radius: var(--radius);
    padding: 22px 16px; margin-bottom: 14px;
  }
  .complete-banner .cb-title {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.6rem, 7vw, 2rem); text-transform: uppercase; letter-spacing: 1px;
  }
  .complete-banner .cb-sub { font-size: 0.9rem; opacity: 0.9; margin-top: 2px; }
  .complete-cta { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .complete-cta .btn { border: none; }
  .complete-cta .btn-on-grad { background: #fff; color: var(--primary); font-weight: 700; }
  .complete-cta .btn-on-grad-ghost { background: rgba(255,255,255,0.16); color: #fff; border: 1.5px solid rgba(255,255,255,0.55); }

  .timer-input-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin: 6px 0 2px;
  }
  .timer-input-row input {
    width: 76px; min-height: 50px; padding: 8px 4px;
    border: 1.5px solid var(--border); border-radius: 12px; background: var(--card);
    font-size: 1.3rem; text-align: center; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .timer-input-row input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
  .timer-input-row .colon { font-size: 1.6rem; font-weight: 800; color: var(--muted-fg); }

  .timer-display {
    font-family: var(--font-display);
    font-size: clamp(4.5rem, 30vw, 9rem);
    font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px; margin: 4px 0 10px;
    color: var(--fg);
    transition: color 0.2s ease;
  }
  .timer-display.warning { color: var(--destructive); }

  .timer-btns { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .timer-btns .btn { min-width: 104px; min-height: 52px; font-family: var(--font-display);
    text-transform: uppercase; letter-spacing: 1px; font-size: 1.05rem; font-weight: 700; }

  .next-round-row {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-top: 18px; font-size: 0.88rem; color: var(--muted-fg);
  }
  .next-round-row label { font-weight: 600; }
  .next-round-row select {
    min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--border);
    border-radius: 12px; font-size: 0.95rem; font-weight: 600;
    background: var(--card); color: var(--fg); cursor: pointer;
  }

  /* ============ Bottom sheets ============ */
  .scrim {
    position: fixed; inset: 0; background: rgba(15,23,42,0.45);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 40;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--card); border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 32px rgba(15,23,42,0.2);
    max-height: 88vh; max-height: 88dvh;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    transform: translateY(105%);
    transition: transform 0.25s ease;
    padding: 8px clamp(14px, 4vw, 22px) calc(18px + env(safe-area-inset-bottom));
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 42px; height: 5px; border-radius: 999px;
    background: var(--border); margin: 4px auto 12px;
  }
  .sheet h3 {
    font-size: clamp(1.2rem, 5vw, 1.4rem); font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.8px;
    text-align: center; margin-bottom: 14px;
  }

  .score-court-block {
    margin-bottom: 12px; padding: 12px;
    background: var(--muted); border: 1.5px solid var(--border); border-radius: 12px;
  }
  .score-court-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--primary);
  }
  .score-team-row {
    display: flex; align-items: center; gap: 10px;
    justify-content: space-between; margin-bottom: 6px;
  }
  .score-team-names { font-weight: 600; font-size: clamp(0.86rem, 2.7vw, 0.94rem); flex: 1; min-width: 0; line-height: 1.35; }
  .score-input {
    width: 72px; min-height: 50px; padding: 8px 6px; flex-shrink: 0;
    border: 1.5px solid var(--border); border-radius: 12px; background: var(--card);
    font-size: 1.25rem; text-align: center; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .score-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
  .score-vs-label { text-align: center; font-size: 0.7rem; font-weight: 700; color: var(--muted-fg); letter-spacing: 2px; margin: 2px 0 6px; }
  .inline-error {
    font-size: 0.82rem; color: var(--destructive); font-weight: 600;
    margin-top: 8px; display: none;
  }
  .sheet-btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .sheet-btns .btn { flex: 1 1 auto; }

  /* Bonus sheet bits */
  .bonus-court-block {
    margin-bottom: 12px; padding: 12px;
    background: var(--muted); border: 1.5px solid var(--border); border-radius: 12px;
  }
  .bonus-court-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bonus-court-label-text {
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--primary);
  }
  .bonus-court-name-input {
    width: 84px; min-height: 44px; padding: 6px 10px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 0.95rem; font-weight: 600; text-align: center; background: var(--card);
  }
  .bonus-team-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .bonus-team-label { font-size: 0.78rem; font-weight: 700; color: var(--muted-fg); width: 54px; flex-shrink: 0; }
  .bonus-select {
    min-height: 44px; padding: 8px 8px; border: 1.5px solid var(--border); border-radius: 10px;
    font-size: clamp(0.84rem, 2.4vw, 0.9rem); font-weight: 600; flex: 1; min-width: 80px;
    background: var(--card); color: var(--fg); cursor: pointer;
  }
  .bonus-vs-label { text-align: center; font-size: 0.7rem; font-weight: 700; color: var(--muted-fg); letter-spacing: 2px; margin: 2px 0 8px; }

  /* ============ Standings tab ============ */
  .standings-sub { font-size: 0.85rem; color: var(--muted-fg); margin: -6px 0 14px; }
  .standings-table-wrap {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .scoreboard-table {
    width: 100%; border-collapse: collapse;
    font-size: clamp(0.8rem, 2.5vw, 0.95rem);
    font-variant-numeric: tabular-nums;
  }
  .scoreboard-table th, .scoreboard-table td {
    padding: clamp(8px, 2vw, 10px) clamp(4px, 1.4vw, 10px);
    text-align: center; border-bottom: 1px solid var(--border);
  }
  .scoreboard-table thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--primary); color: #fff; font-weight: 700;
    font-size: clamp(0.72rem, 2.2vw, 0.85rem);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .scoreboard-table thead th:nth-child(2),
  .scoreboard-table tbody td:nth-child(2) { text-align: left; }
  .scoreboard-table tbody td:nth-child(2) { font-weight: 600; }
  .scoreboard-table tbody tr:last-child td { border-bottom: none; }
  .scoreboard-table tbody tr:nth-child(even) td { background: var(--muted); }
  .scoreboard-rank { font-family: var(--font-display); font-weight: 700; color: var(--muted-fg); }
  tr.rank-top .scoreboard-rank { color: var(--accent); font-size: 1.05em; }
  tr.rank-top td:nth-child(2) { font-weight: 700; color: var(--accent-dark); }
  .diff-pos { color: var(--accent); font-weight: 700; }
  .diff-neg { color: var(--destructive); font-weight: 700; }

  /* ============ Tab bar ============ */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: none;
    background: var(--card); border-top: 1.5px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar.show { display: flex; }
  .tabbar button {
    flex: 1; min-height: var(--tabbar-h);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; border: none; background: transparent;
    color: var(--muted-fg); font-size: 0.7rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px;
    position: relative;
  }
  .tabbar button.active { color: var(--primary); }
  .tabbar button.active::before {
    content: ''; position: absolute; top: 0; left: 22%; right: 22%;
    height: 3px; border-radius: 0 0 3px 3px; background: var(--primary);
  }
  .tabbar svg { width: 24px; height: 24px; }

  /* ============ Print ============ */
  .print-only { display: none; }

  @media print {
    .no-print, .tabbar, .setup-cta, .scrim, .sheet { display: none !important; }
    body { background: #fff; }
    .view-pad { padding: 0; max-width: none; }
    .screen-only { display: none !important; }
    .print-only { display: block !important; }

    .print-header { text-align: center; margin-bottom: 12px; }
    .print-header h1 { font-size: 1.5rem; color: #000; }
    .print-header .sub { font-size: 0.85rem; color: #444; }

    .print-schedule { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .print-schedule th, .print-schedule td {
      border: 1.5px solid #1a1a1a; padding: 4px; text-align: center;
      vertical-align: middle; color: #1a1a1a; font-size: 1rem;

    .print-schedule thead th { background: #1a1a1a !important; color: #fff !important;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .print-schedule thead th:first-child { width: 60px; }
    .print-schedule tbody td { height: 1.05in; }
    .print-schedule .p-round-label { font-weight: 800; }
    .print-schedule .p-vs { color: #888; font-size: 0.75rem; letter-spacing: 1px; }
    .print-schedule .p-score { font-weight: 700; font-size: 0.9rem; margin-top: 4px; }

    .standings-table-wrap { border: none; border-radius: 0; overflow: visible; }
    .scoreboard-table th, .scoreboard-table td { border: 1.5px solid #1a1a1a; color: #1a1a1a; }

      -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .diff-pos, .diff-neg, tr.rank-top td:nth-child(2), tr.rank-top .scoreboard-rank { color: #1a1a1a; }

</style>

<script>
let mode = 'random';
let currentRound = 0; // 0-indexed
let totalRounds = 7;
let roundsData = [];   // stored after generate
let courtsData = [];
let scoresData = [];   // parallel to roundsData: scoresData[r][c] = { team1, team2 } | null entries
let playersData = [];  // snapshot of player names at generate time

const SCROLL_BEHAVIOR = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

/* ============ View / tab state ============ */
let activeTab = 'schedule';

function showShell() {
  document.getElementById('viewSetup').classList.remove('active');
  document.getElementById('setupCta').classList.remove('show');
  document.getElementById('appShell').classList.add('active');
  document.getElementById('tabbar').classList.add('show');
}

function switchTab(name) {
  activeTab = name;
  const tabs = { schedule: 'tabSchedule', timer: 'tabTimer', standings: 'tabStandings' };
  for (const key of Object.keys(tabs)) {
    document.getElementById(tabs[key]).classList.toggle('active', key === name);
    document.getElementById('tabBtn' + key.charAt(0).toUpperCase() + key.slice(1))
      .classList.toggle('active', key === name);
  }
  if (name === 'standings') refreshScoreboard();
  if (name === 'schedule') scrollActiveCardIntoView();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function goBack() {
  document.getElementById('appShell').classList.remove('active');
  document.getElementById('tabbar').classList.remove('show');
  document.getElementById('viewSetup').classList.add('active');
  document.getElementById('setupCta').classList.add('show');
  // Session is intentionally preserved.
}

/* ============ Setup ============ */
function setMode(m) {
  mode = m;
  document.querySelectorAll('#modeToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });
  document.getElementById('modeHint').textContent =
    m === 'random'
      ? 'All matchups are completely random.'
      : 'Same-color pairs only face same-color. Mixed teams balanced by skill.';
  document.getElementById('skillLegend').classList.toggle('show', m === 'balanced');
  document.querySelectorAll('.skill-btn').forEach(b => {
    b.classList.toggle('hidden', m === 'random');
  });
  saveSetup();
}

function toggleSkill(btn) {
  const cycle = ['green', 'blue', 'orange', 'red'];
  const cur = btn.dataset.skill;
  const next = cycle[(cycle.indexOf(cur) + 1) % cycle.length];
  btn.dataset.skill = next;
  saveSetup();
}

// Build player rows
(function initPlayers() {
  const list = document.getElementById('playerList');
  for (let i = 1; i <= 8; i++) {
    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `
      <span class="player-num">${i}</span>
      <input id="p${i}" placeholder="Player ${i}" autocomplete="off">
      <button type="button" class="skill-btn hidden" id="sk${i}" data-skill="green" onclick="toggleSkill(this)" aria-label="Skill level for player ${i}"></button>
    `;
    list.appendChild(row);
  }
})();

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getPlayers() {
  return Array.from({ length: 8 }, (_, i) =>
    document.getElementById(`p${i + 1}`).value.trim() || `Player ${i + 1}`
  );
}

function getSkills() {
  return Array.from({ length: 8 }, (_, i) =>
    document.getElementById(`sk${i + 1}`).dataset.skill
  );
}

function getCourts() {
  return ['A', 'B'];
}

function emptyScores(rounds) {
  return rounds.map(round => round.map(() => ({ team1: null, team2: null })));
}

function generate() {
  const players = getPlayers();
  const courts = getCourts();
  const skills = getSkills();
  courtsData = courts;
  playersData = players;
  roundsData = buildSchedule(players, skills);
  scoresData = emptyScores(roundsData);
  totalRounds = 7;
  currentRound = 0;
  showShell();
  renderSchedule();
  buildNextRoundSelect();
  updateRoundState();
  timerReset();
  switchTab('schedule');
  saveSession();
}

/* ============ Matchmaking engine (ported verbatim) ============ */
// Skill points: green=4, blue=3, orange=2, red=1
function skillPts(s) {
  return s === 'green' ? 4 : s === 'blue' ? 3 : s === 'orange' ? 2 : 1;
}

function isSameColor(team, skills) {
  return skills[team[0]] === skills[team[1]];
}

function isUnfair(team1, team2, skills) {
  const t1Same = isSameColor(team1, skills);
  const t2Same = isSameColor(team2, skills);

  const t1Green = t1Same && skills[team1[0]] === 'green';
  const t2Green = t2Same && skills[team2[0]] === 'green';

  // Green-pair rule: G/G can ONLY face G/G
  if (t1Green || t2Green) {
    return !(t1Green && t2Green);
  }

  // Non-green teams: check strength gap (max 2 points)
  const p1a = skillPts(skills[team1[0]]), p1b = skillPts(skills[team1[1]]);
  const p2a = skillPts(skills[team2[0]]), p2b = skillPts(skills[team2[1]]);
  if (Math.abs((p1a + p1b) - (p2a + p2b)) > 2) return true;

  // Weakest-player rule: the two teams' weaker players must be within 1 tier.
  const weak1 = Math.min(p1a, p1b);
  const weak2 = Math.min(p2a, p2b);
  if (Math.abs(weak1 - weak2) > 1) return true;

  return false;
}

function matchupKey(team1, team2) {
  const t1 = [Math.min(team1[0], team1[1]), Math.max(team1[0], team1[1])];
  const t2 = [Math.min(team2[0], team2[1]), Math.max(team2[0], team2[1])];
  if (t1[0] < t2[0] || (t1[0] === t2[0] && t1[1] < t2[1])) {
    return t1.join(',') + '-' + t2.join(',');
  }
  return t2.join(',') + '-' + t1.join(',');
}

function isAllGreen(team1, team2, skills) {
  return skills[team1[0]] === 'green' && skills[team1[1]] === 'green'
      && skills[team2[0]] === 'green' && skills[team2[1]] === 'green';
}

function courtStrength(court, skills) {
  return skillPts(skills[court.team1[0]]) + skillPts(skills[court.team1[1]])
       + skillPts(skills[court.team2[0]]) + skillPts(skills[court.team2[1]]);
}

function teamGap(team, skills) {
  return Math.abs(skillPts(skills[team[0]]) - skillPts(skills[team[1]]));
}

function buildSchedule(players, skills) {
  const n = 8;
  const balanced = mode === 'balanced';
  const partnerCount = Array.from({ length: n }, () => new Array(n).fill(0));
  const opponentCount = Array.from({ length: n }, () => new Array(n).fill(0));
  const usedGreenMatchups = new Set();
  const rounds = [];

  for (let r = 0; r < 7; r++) {
    let bestRound = null;
    let bestScore = Infinity;

    for (let attempt = 0; attempt < 1500; attempt++) {
      const order = shuffle([0, 1, 2, 3, 4, 5, 6, 7]);
      const cm = [
        { team1: [order[0], order[1]], team2: [order[2], order[3]] },
        { team1: [order[4], order[5]], team2: [order[6], order[7]] },
      ];

      if (balanced) {
        if (isUnfair(cm[0].team1, cm[0].team2, skills)) continue;
        if (isUnfair(cm[1].team1, cm[1].team2, skills)) continue;
      }

      let score = 0;

      for (const c of cm) {
        const a = c.team1[0], b = c.team1[1], x = c.team2[0], y = c.team2[1];
        score += partnerCount[a][b] * 10 + partnerCount[x][y] * 10;
        score += opponentCount[a][x] + opponentCount[a][y];
        score += opponentCount[b][x] + opponentCount[b][y];
      }

      if (balanced) {
        for (const c of cm) {
          const ag = isAllGreen(c.team1, c.team2, skills);
          if (ag) {
            const key = matchupKey(c.team1, c.team2);
            if (usedGreenMatchups.has(key)) {
              score += 1000;
            } else {
              score -= 100;
            }
          }
        }
      }

      if (score < bestScore) { bestScore = score; bestRound = cm; }
    }

    if (!bestRound) {
      // Tier 2: try more attempts with only the G/G constraint
      for (let fb = 0; fb < 1500; fb++) {
        const order = shuffle([0, 1, 2, 3, 4, 5, 6, 7]);
        const cm = [
          { team1: [order[0], order[1]], team2: [order[2], order[3]] },
          { team1: [order[4], order[5]], team2: [order[6], order[7]] },
        ];
        let ggOk = true;
        for (const c of cm) {
          const g1 = isSameColor(c.team1, skills) && skills[c.team1[0]] === 'green';
          const g2 = isSameColor(c.team2, skills) && skills[c.team2[0]] === 'green';
          if ((g1 || g2) && !(g1 && g2)) { ggOk = false; break; }
        }
        if (!ggOk) continue;
        bestRound = cm;
        break;
      }
    }
    // Tier 3: force-partition greens if exactly 4
    if (!bestRound) {
      const greenIdxs = [0,1,2,3,4,5,6,7].filter(i => skills[i] === 'green');
      const nonGreen = [0,1,2,3,4,5,6,7].filter(i => skills[i] !== 'green');
      if (greenIdxs.length === 4) {
        const gs = shuffle(greenIdxs);
        const ng = shuffle(nonGreen);
        bestRound = [
          { team1: [gs[0], gs[1]], team2: [gs[2], gs[3]] },
          { team1: [ng[0], ng[1]], team2: [ng[2], ng[3]] },
        ];
      } else {
        // No green partition possible — random fallback
        const order = shuffle([0, 1, 2, 3, 4, 5, 6, 7]);
        bestRound = [
          { team1: [order[0], order[1]], team2: [order[2], order[3]] },
          { team1: [order[4], order[5]], team2: [order[6], order[7]] },
        ];
      }
    }

    if (balanced) {
      for (const c of bestRound) {
        if (isAllGreen(c.team1, c.team2, skills)) {
          usedGreenMatchups.add(matchupKey(c.team1, c.team2));
        }
      }
    }

    for (const c of bestRound) {
      const [a, b] = c.team1, [x, y] = c.team2;
      partnerCount[a][b]++; partnerCount[b][a]++;
      partnerCount[x][y]++; partnerCount[y][x]++;
      opponentCount[a][x]++; opponentCount[x][a]++;
      opponentCount[a][y]++; opponentCount[y][a]++;
      opponentCount[b][x]++; opponentCount[x][b]++;
      opponentCount[b][y]++; opponentCount[y][b]++;
    }

    // NOTE: Court priority swap is applied after sorting below.
    rounds.push(bestRound);
  }

  // Sort rounds by descending spread (balanced mode only)
  if (balanced) {
    // Attach original index for stable tiebreak
    const indexed = rounds.map((round, origIdx) => {
      const spread = round.reduce((sum, c) => {
        return sum + teamGap(c.team1, skills) + teamGap(c.team2, skills);
      }, 0);
      return { round, spread, origIdx };
    });

    // Stable descending sort: higher spread first; ties keep generation order
    indexed.sort((a, b) => {
      if (b.spread !== a.spread) return b.spread - a.spread;
      return a.origIdx - b.origIdx;
    });

    // Rebuild rounds array in sorted order
    rounds.length = 0;
    for (const item of indexed) {
      rounds.push(item.round);
    }
  }

  // Always put weaker matchup on Court A (index 0), stronger on Court B (index 1)
  for (let fi = 0; fi < rounds.length; fi++) {
    const str0 = courtStrength(rounds[fi][0], skills);
    const str1 = courtStrength(rounds[fi][1], skills);
    if (str0 > str1) rounds[fi] = [rounds[fi][1], rounds[fi][0]];
  }

  // Map indices to player names (final step, after sort)
  return rounds.map(round => round.map(c => ({
    team1: c.team1.map(i => players[i]),
    team2: c.team2.map(i => players[i]),
  })));
}

/* ============ Schedule rendering (cards + print table) ============ */
function roundLabel(i) {
  return i < 7 ? `Round ${i + 1}` : `Bonus ${i - 6}`;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderSchedule() {
  const cardsEl = document.getElementById('scheduleCards');
  const isDone = currentRound >= totalRounds;

  let html = '';
  roundsData.forEach((round, i) => {
    let state, statusText;
    if (i < currentRound) { state = 'r-done'; statusText = 'Done'; }
    else if (i === currentRound && !isDone) { state = 'r-active'; statusText = 'Now'; }
    else if (isDone) { state = 'r-done'; statusText = 'Done'; }
    else { state = 'r-upcoming'; statusText = 'Up next'; }
    if (state === 'r-done' && i >= currentRound && isDone) statusText = 'Done';

    let courtsHtml = '';
    round.forEach((m, c) => {
      const sc = scoresData[i] && scoresData[i][c];
      const hasScore = sc && sc.team1 !== null && sc.team2 !== null;
      const badge = hasScore
        ? `<span class="score-badge">${sc.team1}&ndash;${sc.team2}</span>`
        : `<span class="score-badge pending">&mdash;</span>`;
      courtsHtml += `
        <div class="rc-court">
          <span class="court-chip">${esc(courtsData[c] || (c + 1))}</span>
          <span class="rc-match">
            <b>${esc(m.team1[0])}</b> &amp; <b>${esc(m.team1[1])}</b>
            <span class="rc-vs">VS</span>
            <b>${esc(m.team2[0])}</b> &amp; <b>${esc(m.team2[1])}</b>
          </span>
          ${badge}
        </div>`;
    });

    html += `
      <div class="round-card ${state}" id="round-card-${i}">
        <div class="rc-head">
          <span class="rc-label">${roundLabel(i)}</span>
          <span class="rc-status">${statusText}</span>
        </div>
        ${courtsHtml}
      </div>`;
  });
  cardsEl.innerHTML = html;

  renderPrintSchedule();
}

function renderPrintSchedule() {
  const courts = courtsData;
  const hdr0 = courts[0] ? `Court ${esc(courts[0])}` : 'Court 1';
  const hdr1 = courts[1] ? `Court ${esc(courts[1])}` : 'Court 2';

  const cell = (m) =>
    `<b>${esc(m.team1[0])}</b> &amp; <b>${esc(m.team1[1])}</b><br>` +
    `<span class="p-vs">vs</span><br>` +
    `<b>${esc(m.team2[0])}</b> &amp; <b>${esc(m.team2[1])}</b>`;

  let html = `
    <div class="print-header">
      <h1>Pickleball Round Robin</h1>
      <div class="sub">Courts ${esc(courts[0] || 'A')} &amp; ${esc(courts[1] || 'B')}</div>
    </div>
    <table class="print-schedule">
      <thead>
        <tr><th></th><th>${hdr0}</th><th>${hdr1}</th></tr>
      </thead>
      <tbody>`;

  roundsData.forEach((round, i) => {
    const m0 = round[0] || null;
    const m1 = round[1] || null;
    const scoreHtml = (r, c) => {
      if (scoresData[r] && scoresData[r][c] && scoresData[r][c].team1 !== null) {
        const s = scoresData[r][c];
        return `<div class="p-score">${s.team1}&ndash;${s.team2}</div>`;
      }
      return '';
    };
    const cell0 = m0 ? `<td>${cell(m0)}${scoreHtml(i, 0)}</td>` : `<td>&mdash;</td>`;
    const cell1 = m1 ? `<td>${cell(m1)}${scoreHtml(i, 1)}</td>` : `<td>&mdash;</td>`;
    html += `<tr><td class="p-round-label">${roundLabel(i)}</td>${cell0}${cell1}</tr>`;
  });

  html += `</tbody></table>`;
  document.getElementById('printSchedule').innerHTML = html;
}

function scrollActiveCardIntoView() {
  if (currentRound >= totalRounds) return;
  const card = document.getElementById(`round-card-${currentRound}`);
  if (card) {
    requestAnimationFrame(() => {
      card.scrollIntoView({ behavior: SCROLL_BEHAVIOR, block: 'center' });
    });
  }
}

/* ============ Round state management ============ */
function buildNextRoundSelect() {
  const sel = document.getElementById('nextRoundSelect');
  sel.innerHTML = '';
  for (let i = 0; i < totalRounds; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i < 7 ? `Round ${i + 1}` : `Bonus ${i - 6}`;
    sel.appendChild(opt);
  }
  const fin = document.createElement('option');
  fin.value = totalRounds;
  fin.textContent = 'Finish (complete)';
  sel.appendChild(fin);
  updateNextRoundSelect();
}

function updateNextRoundSelect() {
  const sel = document.getElementById('nextRoundSelect');
  const next = Math.min(currentRound + 1, totalRounds);
  sel.value = next;
}

function updateRoundState(autoScroll = true) {
  const isDone = currentRound >= totalRounds;
  const indicator = document.getElementById('roundIndicator');
  const progress = document.getElementById('roundProgress');
  const nowPlaying = document.getElementById('nowPlaying');

  if (isDone) {
    indicator.textContent = '';
    progress.textContent = '';
    nowPlaying.innerHTML = `
      <div class="complete-banner">
        <div class="cb-title">Tournament Complete</div>
        <div class="cb-sub">All ${totalRounds} rounds played. Great games out there.</div>
        <div class="complete-cta">
          <button type="button" class="btn btn-on-grad" onclick="switchTab('standings')">View Scoreboard</button>
          <button type="button" class="btn btn-on-grad-ghost" onclick="openBonusPanel()">Add Bonus Round</button>
        </div>
      </div>`;
  } else {
    indicator.textContent = `${roundLabel(currentRound)} of ${totalRounds}`;
    const done = currentRound;
    const remaining = totalRounds - currentRound - 1;
    progress.textContent = done > 0 ? `${done} played, ${remaining} remaining after this round` : '';

    const cm = roundsData[currentRound];
    const courts = courtsData;
    nowPlaying.innerHTML = cm.map((m, ci) => `
      <div class="np-court">
        <span class="court-chip">${esc(courts[ci] || (ci + 1))}</span>
        <span class="np-match">
          <b>${esc(m.team1[0])}</b> &amp; <b>${esc(m.team1[1])}</b>
          <span class="rc-vs">VS</span>
          <b>${esc(m.team2[0])}</b> &amp; <b>${esc(m.team2[1])}</b>
        </span>
      </div>
    `).join('');
  }

  renderSchedule();

  if (!isDone && autoScroll && activeTab === 'schedule') {
    scrollActiveCardIntoView();
  }

  updateNextRoundSelect();
  saveSession();
}

/* ============ Timer (ported) ============ */
let timerInterval = null;
let timerRemaining = 0;
let timerRunning = false;
let timerDeadline = null;

function getTimerInputSeconds() {
  const m = parseInt(document.getElementById('timerMin').value) || 0;
  const s = parseInt(document.getElementById('timerSec').value) || 0;
  return m * 60 + s;
}

function formatTime(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  el.textContent = formatTime(timerRemaining);
  el.classList.toggle('warning', timerRemaining <= 30 && timerRemaining > 0);
  if (timerRemaining <= 0 && timerRunning) {
    el.classList.add('warning');
  }
}

document.getElementById('timerMin').addEventListener('input', function() {
  if (!timerRunning) {
    timerRemaining = getTimerInputSeconds();
    updateTimerDisplay();
  }
});
document.getElementById('timerSec').addEventListener('input', function() {
  if (!timerRunning) {
    timerRemaining = getTimerInputSeconds();
    updateTimerDisplay();
  }
});

function startSystemBackupTimer(seconds) {
  if (!/Android/i.test(navigator.userAgent)) return;
  saveSession();
  window.location.href = 'intent:#Intent;action=android.intent.action.SET_TIMER;'
    + 'i.android.intent.extra.alarm.LENGTH=' + seconds + ';'
    + 'B.android.intent.extra.alarm.SKIP_UI=true;end';
}

function timerTick() {
  if (!timerRunning) return;
  timerRemaining = Math.max(0, Math.round((timerDeadline - Date.now()) / 1000));
  updateTimerDisplay();
  if (timerRemaining <= 0) {
    clearInterval(timerInterval);
    timerRunning = false;
    timerDeadline = null;
    document.getElementById('timerStartBtn').textContent = 'Start';
    releaseWakeLock();
    playAlarm();
  }
}

function timerStart() {
  const btn = document.getElementById('timerStartBtn');

  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    timerRemaining = Math.max(0, Math.round((timerDeadline - Date.now()) / 1000));
    timerDeadline = null;
    btn.textContent = 'Resume';
    if (window.AndroidAlarm) AndroidAlarm.cancel();
    releaseWakeLock();
    return;
  }

  if (currentRound >= totalRounds) return;

  if (timerRemaining <= 0) {
    timerRemaining = getTimerInputSeconds();
  }
  if (timerRemaining <= 0) return;

  timerDeadline = Date.now() + timerRemaining * 1000;
  timerRunning = true;
  btn.textContent = 'Pause';
  document.getElementById('timerInputRow').style.display = 'none';
  enableWakeLock();
  if (window.AndroidAlarm) {
    AndroidAlarm.start(timerRemaining);
  } else {
    startSystemBackupTimer(timerRemaining);
  }

  timerInterval = setInterval(timerTick, 250);
}

function timerReset() {
  clearInterval(timerInterval);
  timerDeadline = null;
  if (window.AndroidAlarm) AndroidAlarm.cancel();
  timerRunning = false;
  stopAlarm();
  releaseWakeLock();
  timerRemaining = getTimerInputSeconds();
  updateTimerDisplay();
  document.getElementById('timerStartBtn').textContent = 'Start';
  document.getElementById('timerInputRow').style.display = 'flex';
  document.getElementById('timerDisplay').classList.remove('warning');
}

function timerEndRound() {
  // If already at/past end, nothing to do
  if (currentRound >= totalRounds) return;

  timerReset();
  openScorePanel(currentRound);
}

/* ============ Score entry (bottom sheet) ============ */
function openSheet(id) {

function closeSheets() {

function openScorePanel(roundIdx) {

  let html = `<h3>Enter Scores &mdash; ${label}</h3>`;

    const val1 = existing.team1 !== null ? existing.team1 : '';
    const val2 = existing.team2 !== null ? existing.team2 : '';

    html += `
      <div class="score-court-block">
        <div class="score-court-head">

        </div>

          <span class="score-team-names"><b>${esc(m.team1[0])}</b> &amp; <b>${esc(m.team1[1])}</b></span>
          <input class="score-input" id="score-input-${roundIdx}-${c}-team1" type="number" min="0" inputmode="numeric" placeholder="0" value="${val1}">
        </div>
        <div class="score-vs-label">VS</div>
        <div class="score-team-row">
          <span class="score-team-names"><b>${esc(m.team2[0])}</b> &amp; <b>${esc(m.team2[1])}</b></span>
          <input class="score-input" id="score-input-${roundIdx}-${c}-team2" type="number" min="0" inputmode="numeric" placeholder="0" value="${val2}">
        </div>

  html += `

      <button type="button" class="btn btn-accent" onclick="scoreSaveAndContinue(${roundIdx})">Save &amp; Continue</button>
      <button type="button" class="btn btn-ghost" onclick="scoreSkip(${roundIdx})">Skip</button>
      <button type="button" class="btn btn-danger" onclick="scoreCancel()">Cancel</button>
    </div>`;

  body.innerHTML = html;

}

function closeScorePanel() {
  closeSheets();
  document.getElementById('scoreSheetBody').innerHTML = '';
}

function scrollToTimer() {
  // After advancing, the Timer tab hero should be in view for the next round.
  window.scrollTo({ top: 0, behavior: SCROLL_BEHAVIOR });
}

function scoreSaveAndContinue(roundIdx) {
  const round = roundsData[roundIdx];
  if (!round) return;

  let valid = true;

  // Validate all courts
  for (let c = 0; c < round.length; c++) {
    const t1El = document.getElementById(`score-input-${roundIdx}-${c}-team1`);
    const t2El = document.getElementById(`score-input-${roundIdx}-${c}-team2`);
    const errEl = document.getElementById(`score-err-${roundIdx}-${c}`);
    errEl.style.display = 'none';
    errEl.textContent = '';

    const t1Raw = t1El.value.trim();
    const t2Raw = t2El.value.trim();
    const t1 = parseInt(t1Raw, 10);
    const t2 = parseInt(t2Raw, 10);

    if (t1Raw === '' || t2Raw === '' || isNaN(t1) || isNaN(t2) || t1 < 0 || t2 < 0) {
      errEl.textContent = 'Please enter valid non-negative scores for both teams.';
      errEl.style.display = 'block';
      valid = false;
      continue;
    }

    if (t1 === t2) {
      errEl.textContent = "Scores can't be tied — enter the final score after the sudden-death point.";
      errEl.style.display = 'block';
      valid = false;
    }
  }

  if (!valid) return;

  // Store scores
  for (let c = 0; c < round.length; c++) {
    const t1 = parseInt(document.getElementById(`score-input-${roundIdx}-${c}-team1`).value, 10);
    const t2 = parseInt(document.getElementById(`score-input-${roundIdx}-${c}-team2`).value, 10);
    if (!scoresData[roundIdx]) scoresData[roundIdx] = [];
    scoresData[roundIdx][c] = { team1: t1, team2: t2 };
  }

  closeScorePanel();

  // Advance round
  const sel = document.getElementById('nextRoundSelect');
  currentRound = parseInt(sel.value);
  updateRoundState(false);
  scrollToTimer();
  saveSession();
}

function scoreSkip(roundIdx) {
  closeScorePanel();
  // Advance without storing scores
  const sel = document.getElementById('nextRoundSelect');
  currentRound = parseInt(sel.value);
  updateRoundState(false);
  scrollToTimer();
  saveSession();
}

function scoreCancel() {
  closeScorePanel();
  // Do NOT advance round, do NOT save session
}

/* ============ Scoreboard ============ */
function computeStandings() {
  const stats = {};
  for (const name of playersData) {
    stats[name] = { wins: 0, losses: 0, pf: 0, pa: 0, games: 0 };
  }

  for (let r = 0; r < roundsData.length; r++) {
    const round = roundsData[r];
    for (let c = 0; c < round.length; c++) {
      const sc = scoresData[r] && scoresData[r][c];
      if (!sc || sc.team1 === null || sc.team2 === null) continue;

      const s1 = sc.team1;
      const s2 = sc.team2;
      const win1 = s1 > s2;
      const m = round[c];

      for (const name of m.team1) {
        if (!stats[name]) stats[name] = { wins: 0, losses: 0, pf: 0, pa: 0, games: 0 };
        stats[name].games++;
        stats[name].pf += s1;
        stats[name].pa += s2;
        if (win1) stats[name].wins++; else stats[name].losses++;
      }
      for (const name of m.team2) {
        if (!stats[name]) stats[name] = { wins: 0, losses: 0, pf: 0, pa: 0, games: 0 };
        stats[name].games++;
        stats[name].pf += s2;
        stats[name].pa += s1;
        if (!win1) stats[name].wins++; else stats[name].losses++;
      }
    }
  }

  return Object.entries(stats).map(([name, s]) => {
    const avg = s.games ? (s.pf - s.pa) / s.games : 0;
    return { name, ...s, avg };
  }).sort((a, b) => {
    if (b.wins !== a.wins) return b.wins - a.wins;
    if (b.avg !== a.avg) return b.avg - a.avg;
    return b.pf - a.pf;
  });
}

function formatAvgDiff(avg) {
  return (avg >= 0 ? '+' : '') + avg.toFixed(2);
}

function refreshScoreboard() {
  const standings = computeStandings();
  const tbody = document.getElementById('scoreboardBody');
  const sub = document.getElementById('scoreboardSub');

  // Count played rounds for subtitle
  let playedRounds = 0;
  for (let r = 0; r < roundsData.length; r++) {
    for (let c = 0; c < (roundsData[r] || []).length; c++) {
      const sc = scoresData[r] && scoresData[r][c];
      if (sc && sc.team1 !== null) { playedRounds++; break; }
    }
  }
  sub.textContent = `${playedRounds} round(s) scored`;

  tbody.innerHTML = standings.map((row, i) => {
    const diffClass = row.avg >= 0 ? 'diff-pos' : 'diff-neg';
    const topClass = i < 3 ? ' class="rank-top"' : '';
    return `<tr${topClass}>
      <td class="scoreboard-rank">${i + 1}</td>
      <td>${esc(row.name)}</td>
      <td>${row.wins}</td>
      <td>${row.losses}</td>
      <td>${row.pf}</td>
      <td>${row.pa}</td>
      <td class="${diffClass}">${formatAvgDiff(row.avg)}</td>
    </tr>`;
  }).join('');
}

/* ============ Bonus round ============ */
let bonusActiveCourts = 1;

function openBonusPanel() {

  document.querySelectorAll('#bonusCourtsToggle button').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.courts) === 1);

function closeBonusPanel() {

function setBonusCourts(n) {

    b.classList.toggle('active', parseInt(b.dataset.courts) === n);

function renderBonusCourtBlocks() {
  const container = document.getElementById('bonusCourtBlocks');
  let html = '';

  for (let c = 0; c < bonusActiveCourts; c++) {
    const defaultCourtName = courtsData[c] || (c + 1);
    const playerOptions = playersData.map(name => `<option value="${esc(name)}">${esc(name)}</option>`).join('');

    html += `
      <div class="bonus-court-block" id="bonus-court-block-${c}">
        <div class="bonus-court-header">
          <span class="bonus-court-label-text">Court</span>
          <input class="bonus-court-name-input" id="bonus-court-name-${c}" type="text" value="${esc(defaultCourtName)}">
        </div>
        <div class="bonus-team-row">
          <span class="bonus-team-label">Team A</span>
          <select class="bonus-select" id="bonus-c${c}-a1">${playerOptions}</select>
          <select class="bonus-select" id="bonus-c${c}-a2">${playerOptions}</select>
        </div>
        <div class="bonus-vs-label">VS</div>
        <div class="bonus-team-row">
          <span class="bonus-team-label">Team B</span>
          <select class="bonus-select" id="bonus-c${c}-b1">${playerOptions}</select>
          <select class="bonus-select" id="bonus-c${c}-b2">${playerOptions}</select>
        </div>
        <div style="margin-top:10px;">
          <button type="button" class="btn btn-ghost" onclick="randomizeBonus(${c})">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/></svg>
            Randomize
          </button>
        </div>
      </div>`;
  }

  container.innerHTML = html;

  // Set default selections to avoid all-same
  for (let c = 0; c < bonusActiveCourts; c++) {
    const opts = playersData;
    if (opts.length >= 4) {
      document.getElementById(`bonus-c${c}-a1`).value = opts[0];
      document.getElementById(`bonus-c${c}-a2`).value = opts[1];
      document.getElementById(`bonus-c${c}-b1`).value = opts[2];
      document.getElementById(`bonus-c${c}-b2`).value = opts[3];
    }
  }
}

function randomizeBonus(c) {
  const shuffled = shuffle([...playersData]);
  const ids = [`bonus-c${c}-a1`, `bonus-c${c}-a2`, `bonus-c${c}-b1`, `bonus-c${c}-b2`];
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(ids[i]);
    if (el && shuffled[i]) el.value = shuffled[i];
  }
}

function confirmBonus() {
  const errEl = document.getElementById('bonusError');
  errEl.style.display = 'none';
  errEl.textContent = '';

  const newRound = [];

  // Collect
  for (let c = 0; c < bonusActiveCourts; c++) {
    const a1 = document.getElementById(`bonus-c${c}-a1`).value;
    const a2 = document.getElementById(`bonus-c${c}-a2`).value;
    const b1 = document.getElementById(`bonus-c${c}-b1`).value;
    const b2 = document.getElementById(`bonus-c${c}-b2`).value;
    newRound.push({ team1: [a1, a2], team2: [b1, b2] });
  }

  // Validate distinct players per court
  for (let c = 0; c < bonusActiveCourts; c++) {
    const players = [newRound[c].team1[0], newRound[c].team1[1], newRound[c].team2[0], newRound[c].team2[1]];
    const unique = new Set(players);
    if (unique.size < 4) {
      errEl.textContent = `Court ${c + 1}: all 4 players must be different.`;
      errEl.style.display = 'block';
      return;
    }
  }

  // Validate 8 distinct across both courts (when 2 courts)
  if (bonusActiveCourts === 2) {
    const all = [
      ...newRound[0].team1, ...newRound[0].team2,
      ...newRound[1].team1, ...newRound[1].team2,
    ];
    const unique = new Set(all);
    if (unique.size < 8) {
      errEl.textContent = 'With both courts active, all 8 players across both courts must be different.';
      errEl.style.display = 'block';
      return;
    }
  }

  // Court label inputs are cosmetic (matches index.html behavior).

  // Append to roundsData and scoresData
  roundsData.push(newRound);
  scoresData.push(newRound.map(() => ({ team1: null, team2: null })));
  totalRounds++;

  closeBonusPanel();

  buildNextRoundSelect();
  currentRound = roundsData.length - 1;
  updateRoundState();

  switchTab('schedule');
  scrollActiveCardIntoView();

  saveSession();
}

/* ============ Session persistence ============ */
const SESSION_KEY = 'pickleball-rr-session-v1';

function saveSession() {
  try {
    const data = {
      roundsData,
      scoresData,
      courtsData,
      currentRound,
      totalRounds,
      playersData,
    };
    localStorage.setItem(SESSION_KEY, JSON.stringify(data));
  } catch {}
}

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

/* ============ Loud alarm using Web Audio API (ported verbatim) ============ */
let alarmCtx = null;
let alarmRepeatId = null;

function playAlarm() {
  stopAlarm();
  alarmCtx = new (window.AudioContext || window.webkitAudioContext)();

  function beepCycle() {
    if (!alarmCtx) return;
    for (let i = 0; i < 3; i++) {
      const osc = alarmCtx.createOscillator();
      const gain = alarmCtx.createGain();
      osc.connect(gain);
      gain.connect(alarmCtx.destination);
      osc.type = 'square';
      osc.frequency.value = 1000;
      gain.gain.value = 0.6;
      const start = alarmCtx.currentTime + i * 0.35;
      osc.start(start);
      osc.stop(start + 0.2);
    }
  }

  beepCycle();
  alarmRepeatId = setInterval(beepCycle, 1500);
}

function stopAlarm() {
  if (alarmRepeatId) { clearInterval(alarmRepeatId); alarmRepeatId = null; }
  if (alarmCtx) { alarmCtx.close(); alarmCtx = null; }
}

/* ============ Wake Lock (ported verbatim) ============ */
let wakeLock = null;
let wantWakeLock = false;

async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch {}
}

function enableWakeLock() {
  wantWakeLock = true;
  acquireWakeLock();
}

function releaseWakeLock() {
  wantWakeLock = false;
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (wantWakeLock && document.visibilityState === 'visible' && !wakeLock) {
    acquireWakeLock();
  }
  if (timerRunning) timerTick();
});

/* ============ Setup persistence ============ */
const STORAGE_KEY = 'pickleball-rr-setup-v1';
let isLoadingSetup = false;

function saveSetup() {
  if (isLoadingSetup) return;
  try {
    const data = {
      players: Array.from({ length: 8 }, (_, i) => document.getElementById(`p${i + 1}`).value),
      skills: Array.from({ length: 8 }, (_, i) => document.getElementById(`sk${i + 1}`).dataset.skill),
      mode,
      timerMin: document.getElementById('timerMin').value,
      timerSec: document.getElementById('timerSec').value,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch {}
}

function loadSetup() {
  let data;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    data = JSON.parse(raw);
  } catch { return; }

  isLoadingSetup = true;
  try {
    if (Array.isArray(data.players)) {
      data.players.forEach((v, i) => {
        const el = document.getElementById(`p${i + 1}`);
        if (el && v) el.value = v;
      });
    }
    if (Array.isArray(data.skills)) {
      data.skills.forEach((v, i) => {
        const el = document.getElementById(`sk${i + 1}`);
        if (el && v) el.dataset.skill = v;
      });
    }
    if (data.mode) setMode(data.mode);
    if (data.timerMin != null) document.getElementById('timerMin').value = data.timerMin;
    if (data.timerSec != null) document.getElementById('timerSec').value = data.timerSec;
  } finally {
    isLoadingSetup = false;
  }
}

document.getElementById('viewSetup').addEventListener('input', saveSetup);
document.getElementById('timerMin').addEventListener('input', saveSetup);
document.getElementById('timerSec').addEventListener('input', saveSetup);

/* ============ Init ============ */
loadSetup();
timerRemaining = getTimerInputSeconds();
updateTimerDisplay();

// Restore session on init — land on the Timer tab (most useful mid-tournament)
(function restoreSession() {
  const session = loadSession();
  if (!session) return;
  if (!Array.isArray(session.roundsData) || session.roundsData.length === 0) return;

  roundsData = session.roundsData;
  scoresData = session.scoresData || emptyScores(roundsData);
  courtsData = session.courtsData || getCourts();
  currentRound = typeof session.currentRound === 'number' ? session.currentRound : 0;
  totalRounds = typeof session.totalRounds === 'number' ? session.totalRounds : roundsData.length;
  playersData = session.playersData || [];

  showShell();
  renderSchedule();
  buildNextRoundSelect();
  updateRoundState(false);
  switchTab('timer');
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
